
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinguKernel</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;overflow:hidden;height:100vh;
  background:radial-gradient(ellipse at 50% 110%,#12618d 0%,#07182e 48%,#020610 100%);
  color:#80eaff;font-family:Consolas,monospace;
}
.aurora{
 position:absolute;top:-30%;left:-20%;width:140%;height:75%;
 background:linear-gradient(120deg,transparent 15%,#00aaff22 35%,#00ffe522 48%,#4361ee33 65%,transparent 85%);
 filter:blur(35px);transform:rotate(-12deg);
 animation:aurora 12s ease-in-out infinite alternate;
}
@keyframes aurora{
 from{transform:translateX(-8%) rotate(-12deg)}
 to{transform:translateX(8%) rotate(8deg)}
}
#code{position:absolute;inset:0;opacity:.45;overflow:hidden;
 color:#40dfff;font-size:14px;line-height:1.8;white-space:pre-wrap;
 text-shadow:0 0 8px #00bfff}
.scene{position:absolute;inset:0;display:grid;place-items:center}
.penguins{display:flex;gap:clamp(12px,5vw,70px);align-items:end;
 filter:drop-shadow(0 0 25px #00aaff66)}
.penguin{font-size:clamp(65px,12vw,150px);
 animation:float 3s ease-in-out infinite}
.penguin:nth-child(2){animation-delay:-1s}
.penguin:nth-child(3){animation-delay:-2s}
@keyframes float{0%,100%{transform:translateY(0)}
 50%{transform:translateY(-18px)}}
.panel{position:absolute;bottom:7%;left:5%;right:5%;padding:18px;
 border:1px solid #39dfff66;background:#03152bc9;
 box-shadow:0 0 30px #0077ff22;border-radius:12px}
h1{margin:0 0 8px;font-size:clamp(25px,4vw,48px);
 letter-spacing:.12em;text-shadow:0 0 18px #00bfff}
p{margin:0;color:#b4eaff;font-size:clamp(12px,1.5vw,17px)}
.status{float:right;color:#58ffbe}
.star{position:absolute;background:#b8f5ff;border-radius:50%;
 animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
</style>
</head>
<body>
<div class="aurora"></div>
<div id="code"></div>
<div id="stars"></div>
<div class="scene">
 <div class="penguins">
  <div class="penguin">🐧</div>
  <div class="penguin">🐧</div>
  <div class="penguin">🐧</div>
 </div>
</div>
<div class="panel">
 <h1>PINGUKERNEL <span class="status">● ONLINE</span></h1>
 <p id="message">Iniciando núcleo ártico...</p>
</div>
<script>
const lines=[
"boot: PinguKernel Arctic Core",
"kernel.init()  -> OK",
"blue_lights.enable(true)",
"penguin.network.connect()",
"ice_temperature: -32 C",
"aurora.render(frame++)",
"security.status = SECURE",
"system.ready()  -> TRUE",
"while (penguins.awake) { code(); }",
"memory.check()  -> OK",
"polar_link.established()"
];
let frame=0;
function update(){
 let out="";
 for(let i=0;i<100;i++){
  out+=lines[(i+frame)%lines.length]+"\n";
 }
 document.getElementById("code").textContent=out;
 frame++;
}
update();
setInterval(update,450);
const messages=[
"Iniciando núcleo ártico...",
"Conectando pingüinos programadores...",
"Luces azules: activas",
"Red polar segura",
"Todas las aletas del sistema funcionan",
"PinguKernel está protegiendo tu escritorio"
];
let m=0;
setInterval(()=>{
 document.getElementById("message").textContent=messages[m%messages.length];
 m++;
},3000);
const stars=document.getElementById("stars");
for(let i=0;i<100;i++){
 const s=document.createElement("i");
 s.className="star";
 s.style.left=Math.random()*100+"%";
 s.style.top=Math.random()*100+"%";
 const size=1+Math.random()*3;
 s.style.width=size+"px";s.style.height=size+"px";
 s.style.animationDelay=Math.random()*3+"s";
 stars.appendChild(s);
}
</script>
</body>
</html>
